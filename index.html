<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuseDex</title>
  <link rel="icon" type="image/png" href="./MuseDex_logo.png">

  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1a1d24;
      --border-color: #272c36;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
      position: relative;
    }

    header {
      max-width: 1400px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 6px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .view-toggle {
      display: flex;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .view-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .toggle-all-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-all-btn:hover {
      color: #fff;
      border-color: #3b4252;
    }

    .photo-count {
      font-size: 0.85rem;
      color: var(--text-sub);
      background: var(--card-bg);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    main {
      max-width: 1400px;
      margin: 0 auto 80px;
    }

    /* アコーディオン・人物セクション */
    .person-section {
      margin-bottom: 28px;
      background: #14171f;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }

    .person-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
      background: var(--card-bg);
      transition: background 0.2s;
    }

    .person-header:hover {
      background: #20242e;
    }

    .person-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .accordion-icon {
      font-size: 0.8rem;
      color: var(--text-sub);
      transition: transform 0.25s ease;
      display: inline-block;
    }

    .person-section.collapsed .accordion-icon {
      transform: rotate(-90deg);
    }

    .person-name {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .person-count {
      font-size: 0.8rem;
      color: var(--text-sub);
      background: #282e3c;
      padding: 3px 10px;
      border-radius: 12px;
    }

    .person-body {
      padding: 20px;
      display: block;
    }

    .person-section.collapsed .person-body {
      display: none;
    }

    /* グリッドレイアウト */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .media-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      position: relative;
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .media-card:hover {
      transform: translateY(-2px);
      border-color: #3b4252;
    }

    .media-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 動画バッジ */
    .video-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }

    .card-tags {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      pointer-events: none;
    }

    .tag-badge {
      font-size: 0.7rem;
      background: rgba(15, 17, 21, 0.75);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      border-radius: 4px;
      color: #e5e7eb;
    }

    /* 右下FAB */
    .fab-button {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 58px;
      height: 58px;
      background-color: var(--accent);
      color: #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      border: none;
      z-index: 90;
      transition: transform 0.2s, background-color 0.2s;
    }

    .fab-button:hover {
      transform: scale(1.08);
      background-color: var(--accent-hover);
    }

    /* ドロップオーバーレイ */
    .drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(59, 130, 246, 0.15);
      border: 3px dashed var(--accent);
      z-index: 100;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .drop-overlay.active { display: flex; }
    .drop-box-text {
      background: rgba(15, 17, 21, 0.95);
      padding: 20px 40px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 600;
      border: 1px solid var(--accent);
    }

    /* アップロードモーダル */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 120;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(6px);
    }

    .modal.active { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 540px;
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-content h3 { font-size: 1.2rem; font-weight: 600; }

    /* アップロード対象サムネイル一覧 */
    .upload-queue-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 8px;
      background: #11141a;
      border-radius: 8px;
      min-height: 110px;
      align-items: center;
    }

    .upload-queue-item {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      background: #232832;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .upload-queue-item img, .upload-queue-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-queue-item .type-icon {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 1px 4px;
      border-radius: 4px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .form-group input {
      background: #11141a;
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* プログレスバー */
    .progress-bar-container {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #11141a;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }

    .progress-text {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-align: right;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .btn-cancel { background: #282e3a; color: #fff; }
    .btn-cancel:hover { background: #353c4b; }
    .btn-submit { background: var(--accent); color: #fff; }
    .btn-submit:hover { background: var(--accent-hover); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 拡大ライトボックス */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 150;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .lightbox.active { display: flex; }

    .lightbox-content {
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lightbox-content img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 6px;
      object-fit: contain;
    }

    .lightbox-content iframe {
      width: 80vw;
      height: 80vh;
      border: none;
      border-radius: 8px;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      font-size: 32px;
      color: #9ca3af;
      cursor: pointer;
    }

    .lightbox-close:hover { color: #fff; }

    .status-msg {
      text-align: center;
      padding: 80px 20px;
      font-size: 15px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div id="drop-overlay" class="drop-overlay">
    <div class="drop-box-text">ここに画像・動画をドロップして追加</div>
  </div>

  <header>
    <div class="brand">
      <img src="./MuseDex_logo.png" alt="MuseDex Logo" class="brand-logo">
      <h1 class="brand-title">MuseDex</h1>
    </div>

    <div class="header-controls">
      <div class="view-toggle">
        <button id="btn-group-view" class="view-btn active" onclick="switchView('group')">人物別</button>
        <button id="btn-all-view" class="view-btn" onclick="switchView('all')">すべて</button>
      </div>
      <button id="toggle-accordion-btn" class="toggle-all-btn" onclick="toggleAllAccordions()">すべて閉じる</button>
      <span id="photo-count" class="photo-count">0 items</span>
    </div>
  </header>

  <div id="status" class="status-msg">メディアを読み込み中...</div>
  <main id="main-container"></main>

  <button id="fab-btn" class="fab-button" title="画像・動画を追加">+</button>
  <!-- multiple 属性で複数選択可能に -->
  <input type="file" id="file-input" accept="image/*,video/*" multiple style="display: none;">

  <!-- アップロードモーダル -->
  <div id="upload-modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title">新しいメディアを登録</h3>
      
      <div id="upload-queue" class="upload-queue-container"></div>

      <div class="form-group">
        <label for="input-person">人物名（同じ名前で1つにまとまります）</label>
        <input type="text" id="input-person" placeholder="例: 佐藤、Alice など" list="person-list">
        <datalist id="person-list"></datalist>
      </div>
      <div class="form-group">
        <label for="input-tags">タグ（カンマ区切り）</label>
        <input type="text" id="input-tags" placeholder="例: 記念, 旅行, 動画">
      </div>

      <div id="progress-container" class="progress-bar-container">
        <div class="progress-bar-bg">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
        <span id="progress-text" class="progress-text">0 / 0</span>
      </div>

      <div class="modal-actions">
        <button id="cancel-upload-btn" class="btn btn-cancel" onclick="closeUploadModal()">キャンセル</button>
        <button id="submit-upload-btn" class="btn btn-submit" onclick="executeBatchUpload()">アップロード</button>
      </div>
    </div>
  </div>

  <!-- 拡大ライトボックス -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <div class="lightbox-content" id="lightbox-content" onclick="event.stopPropagation()"></div>
  </div>

  <script>
    const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx0F2NKIoBvHS6IhWbMiiAfs-9YEdeu1RJBJFl413_y_K4JCdU1wGtqwqGTteSjwsRr/exec';

    let mediaItems = [];
    let currentView = 'group';
    let pendingFiles = []; // 一括アップロード用キュー
    let isAllExpanded = true;

    // ==========================================
    // 1. 読み込み & 描画
    // ==========================================
    async function loadGallery() {
      const status = document.getElementById('status');
      const countLabel = document.getElementById('photo-count');

      try {
        const response = await fetch(GAS_ENDPOINT);
        const res = await response.json();

        if (res.status !== 'success') throw new Error(res.message);

        mediaItems = res.data;
        countLabel.textContent = `${mediaItems.length} items`;

        if (mediaItems.length === 0) {
          status.style.display = 'block';
          status.textContent = 'メディアがまだありません。右下の「＋」またはドラッグ＆ドロップで追加してください。';
          document.getElementById('main-container').innerHTML = '';
          return;
        }

        status.style.display = 'none';
        updatePersonDatalist();
        renderGallery();

      } catch (err) {
        status.textContent = `読み込みエラー: ${err.message}`;
      }
    }

    function updatePersonDatalist() {
      const datalist = document.getElementById('person-list');
      datalist.innerHTML = '';
      const uniquePersons = [...new Set(mediaItems.map(p => p.person).filter(p => p && p !== '未分類'))];
      uniquePersons.forEach(person => {
        const opt = document.createElement('option');
        opt.value = person;
        datalist.appendChild(opt);
      });
    }

    function renderGallery() {
      const container = document.getElementById('main-container');
      const toggleBtn = document.getElementById('toggle-accordion-btn');
      container.innerHTML = '';

      if (currentView === 'all') {
        toggleBtn.style.display = 'none';
        const grid = document.createElement('div');
        grid.className = 'gallery-grid';
        mediaItems.forEach(item => grid.appendChild(createMediaCard(item)));
        container.appendChild(grid);
      } else {
        toggleBtn.style.display = 'inline-block';
        const groups = {};
        mediaItems.forEach(item => {
          const person = item.person || '未分類';
          if (!groups[person]) groups[person] = [];
          groups[person].push(item);
        });

        const personKeys = Object.keys(groups).sort((a, b) => {
          if (a === '未分類') return 1;
          if (b === '未分類') return -1;
          return a.localeCompare(b, 'ja');
        });

        personKeys.forEach(person => {
          const sec = document.createElement('section');
          sec.className = 'person-section';

          // アコーディオンヘッダー
          const header = document.createElement('div');
          header.className = 'person-header';
          header.onclick = () => sec.classList.toggle('collapsed');

          header.innerHTML = `
            <div class="person-header-left">
              <span class="accordion-icon">▼</span>
              <span class="person-name">${escapeHtml(person)}</span>
              <span class="person-count">${groups[person].length}件</span>
            </div>
          `;
          sec.appendChild(header);

          // セクション本体
          const body = document.createElement('div');
          body.className = 'person-body';

          const grid = document.createElement('div');
          grid.className = 'gallery-grid';
          groups[person].forEach(item => grid.appendChild(createMediaCard(item)));
          body.appendChild(grid);

          sec.appendChild(body);
          container.appendChild(sec);
        });
      }
    }

    function createMediaCard(item) {
      const card = document.createElement('div');
      card.className = 'media-card';
      card.onclick = () => openLightbox(item);

      const img = document.createElement('img');
      img.src = item.thumbnailUrl;
      img.alt = item.name;
      img.loading = 'lazy';
      card.appendChild(img);

      // 動画バッジ
      if (item.type === 'video') {
        const badge = document.createElement('div');
        badge.className = 'video-badge';
        badge.innerHTML = '▶ 動画';
        card.appendChild(badge);
      }

      if (item.tags && item.tags.length > 0) {
        const tagsContainer = document.createElement('div');
        tagsContainer.className = 'card-tags';
        item.tags.forEach(t => {
          const badge = document.createElement('span');
          badge.className = 'tag-badge';
          badge.textContent = `#${t}`;
          tagsContainer.appendChild(badge);
        });
        card.appendChild(tagsContainer);
      }

      return card;
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('btn-group-view').classList.toggle('active', view === 'group');
      document.getElementById('btn-all-view').classList.toggle('active', view === 'all');
      renderGallery();
    }

    function toggleAllAccordions() {
      const sections = document.querySelectorAll('.person-section');
      const toggleBtn = document.getElementById('toggle-accordion-btn');
      isAllExpanded = !isAllExpanded;

      sections.forEach(sec => {
        sec.classList.toggle('collapsed', !isAllExpanded);
      });
      toggleBtn.textContent = isAllExpanded ? 'すべて閉じる' : 'すべて開く';
    }

    // ==========================================
    // 2. 複数ファイル一括アップロード
    // ==========================================
    const fabBtn = document.getElementById('fab-btn');
    const fileInput = document.getElementById('file-input');
    const dropOverlay = document.getElementById('drop-overlay');

    fabBtn.onclick = () => fileInput.click();

    fileInput.onchange = (e) => {
      if (e.target.files.length > 0) {
        handleSelectedFiles(Array.from(e.target.files));
      }
    };

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropOverlay.classList.add('active');
    });

    window.addEventListener('dragleave', (e) => {
      if (e.relatedTarget === null) dropOverlay.classList.remove('active');
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('active');
      if (e.dataTransfer.files.length > 0) {
        handleSelectedFiles(Array.from(e.dataTransfer.files));
      }
    });

    async function handleSelectedFiles(files) {
      pendingFiles = [];
      const queueContainer = document.getElementById('upload-queue');
      queueContainer.innerHTML = '';

      const validFiles = files.filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
      if (validFiles.length === 0) {
        alert('画像または動画ファイルを選択してください');
        return;
      }

      document.getElementById('modal-title').textContent = `${validFiles.length}件のメディアを登録`;

      for (const file of validFiles) {
        const itemBox = document.createElement('div');
        itemBox.className = 'upload-queue-item';

        const isVideo = file.type.startsWith('video/');
        if (isVideo) {
          // 動画はGASの制限上25MB目安の警告
          if (file.size > 25 * 1024 * 1024) {
            alert(`「${file.name}」は約25MBを超えているため、GAS経由でのアップロードに失敗する可能性があります。`);
          }
          itemBox.innerHTML = `
            <span style="font-size:24px;">🎬</span>
            <span class="type-icon">VIDEO</span>
          `;
        } else {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(file);
          itemBox.appendChild(img);
        }
        queueContainer.appendChild(itemBox);

        // ファイルデータを準備
        const base64Data = await convertFileToBase64(file);
        pendingFiles.push({
          name: file.name,
          mimeType: file.type || (isVideo ? 'video/mp4' : 'image/jpeg'),
          base64: base64Data
        });
      }

      document.getElementById('upload-modal').classList.add('active');
    }

    // 画像はCanvasで2048pxに最適化、動画は直接Base64化
    function convertFileToBase64(file) {
      return new Promise((resolve) => {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;
              const maxDim = 2048;

              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.88));
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        } else {
          // 動画はそのままBase64
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        }
      });
    }

    // 順次一括アップロードの実行
    async function executeBatchUpload() {
      if (pendingFiles.length === 0) return;

      const submitBtn = document.getElementById('submit-upload-btn');
      const cancelBtn = document.getElementById('cancel-upload-btn');
      const progressContainer = document.getElementById('progress-container');
      const progressFill = document.getElementById('progress-fill');
      const progressText = document.getElementById('progress-text');

      submitBtn.disabled = true;
      cancelBtn.disabled = true;
      progressContainer.style.display = 'flex';

      const person = document.getElementById('input-person').value.trim() || '未分類';
      const rawTags = document.getElementById('input-tags').value;
      const tags = rawTags.split(/[,、\s]+/).filter(t => t.trim() !== '');

      const total = pendingFiles.length;
      let successCount = 0;

      for (let i = 0; i < total; i++) {
        const item = pendingFiles[i];
        progressText.textContent = `送信中... (${i + 1} / ${total}) - ${item.name}`;
        progressFill.style.width = `${Math.round(((i) / total) * 100)}%`;

        const payload = {
          fileName: item.name,
          mimeType: item.mimeType,
          base64: item.base64,
          person: person,
          tags: tags
        };

        try {
          const response = await fetch(GAS_ENDPOINT, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
          });
          const res = await response.json();
          if (res.status === 'success') successCount++;
        } catch (err) {
          console.error(`Upload error for ${item.name}:`, err);
        }
      }

      progressFill.style.width = '100%';
      progressText.textContent = `完了 (${successCount} / ${total} 件)`;

      setTimeout(async () => {
        closeUploadModal();
        document.getElementById('status').style.display = 'block';
        document.getElementById('status').textContent = '最新データを読み込み中...';
        await loadGallery();
      }, 800);
    }

    function closeUploadModal() {
      document.getElementById('upload-modal').classList.remove('active');
      document.getElementById('input-person').value = '';
      document.getElementById('input-tags').value = '';
      document.getElementById('file-input').value = '';
      document.getElementById('progress-container').style.display = 'none';
      document.getElementById('submit-upload-btn').disabled = false;
      document.getElementById('cancel-upload-btn').disabled = false;
      pendingFiles = [];
    }

    // ==========================================
    // 3. ライトボックス（画像＆動画プレイヤー）
    // ==========================================
    function openLightbox(item) {
      const container = document.getElementById('lightbox-content');
      container.innerHTML = '';

      if (item.type === 'video') {
        const iframe = document.createElement('iframe');
        iframe.src = item.previewUrl;
        iframe.allow = 'autoplay';
        iframe.allowFullscreen = true;
        container.appendChild(iframe);
      } else {
        const img = document.createElement('img');
        img.src = item.previewUrl;
        img.alt = item.name;
        container.appendChild(img);
      }

      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      // 動画の音声が裏で鳴り続けないよう中身をクリア
      document.getElementById('lightbox-content').innerHTML = '';
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeLightbox();
        closeUploadModal();
      }
    });

    loadGallery();
  </script>
</body>
</html>
