<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuseDex</title>
  
  <!-- ファビコン設定 -->
  <link rel="icon" type="image/png" href="./MuseDex_logo.png">

  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1a1d24;
      --text-color: #f3f4f6;
      --sub-text: #9ca3af;
      --accent: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }

    /* ヘッダー周り */
    header {
      max-width: 1400px;
      margin: 0 auto 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #2d333f;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 6px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .photo-count {
      font-size: 0.9rem;
      color: var(--sub-text);
      background: #232730;
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* ギャラリー一覧 */
    .gallery-grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .image-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      position: relative;
      border: 1px solid #232730;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .image-card:hover {
      transform: translateY(-2px);
      border-color: #3b4252;
    }

    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 拡大モーダル */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 24px;
      backdrop-filter: blur(4px);
    }

    .modal.active { display: flex; }

    .modal img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 6px;
      object-fit: contain;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 24px;
      font-size: 32px;
      color: #9ca3af;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover { color: #fff; }

    .status-msg {
      text-align: center;
      padding: 60px 20px;
      font-size: 15px;
      color: var(--sub-text);
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="./MuseDex_logo.png" alt="MuseDex Logo" class="brand-logo">
      <h1 class="brand-title">MuseDex</h1>
    </div>
    <span id="photo-count" class="photo-count">0 photos</span>
  </header>

  <div id="status" class="status-msg">写真を読み込み中...</div>
  <main class="gallery-grid" id="gallery"></main>

  <!-- 拡大モーダル -->
  <div class="modal" id="modal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img id="modal-img" src="" alt="Expanded View" onclick="event.stopPropagation()">
  </div>

  <script>
    // ★ 発行されたGASの本番ウェブアプリURL（末尾が /exec のもの）を貼り付けてください
    const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx0F2NKIoBvHS6IhWbMiiAfs-9YEdeu1RJBJFl413_y_K4JCdU1wGtqwqGTteSjwsRr/exec';

    async function initGallery() {
      const gallery = document.getElementById('gallery');
      const status = document.getElementById('status');
      const countLabel = document.getElementById('photo-count');

      try {
        const response = await fetch(GAS_ENDPOINT);
        if (!response.ok) {
          throw new Error(`HTTPエラー (${response.status})`);
        }

        const res = await response.json();

        if (res.status !== 'success') {
          throw new Error(res.message || '写真データの取得に失敗しました');
        }

        status.style.display = 'none';
        countLabel.textContent = `${res.count} photos`;

        if (res.data.length === 0) {
          status.style.display = 'block';
          status.textContent = '対象フォルダに画像が見つかりませんでした。';
          return;
        }

        res.data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'image-card';
          
          const img = document.createElement('img');
          img.src = item.thumbnailUrl;
          img.alt = item.name;
          img.loading = 'lazy';
          
          card.onclick = () => openModal(item.previewUrl);
          card.appendChild(img);
          gallery.appendChild(card);
        });

      } catch (error) {
        status.innerHTML = `
          <strong>読み込みエラー:</strong> ${error.message}<br><br>
          <small>※GASのデプロイ設定（アクセス権: 全員）やURLが正しいか確認してください。<br>F12の開発者ツール（Console）にも詳細が出力されます。</small>
        `;
        console.error('Gallery Fetch Error:', error);
      }
    }

    function openModal(previewUrl) {
      const modal = document.getElementById('modal');
      const modalImg = document.getElementById('modal-img');
      modalImg.src = previewUrl;
      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('active');
      document.getElementById('modal-img').src = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    initGallery();
  </script>
</body>
</html>
